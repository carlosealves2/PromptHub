services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - GRAPHQL_INTROSPECTION=${GRAPHQL_INTROSPECTION:-false}
      - GRAPHQL_CSRF_PREVENTION=${GRAPHQL_CSRF_PREVENTION:-true}
    networks:
      - prompthub

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - prompthub

networks:
  prompthub:
    driver: bridge
