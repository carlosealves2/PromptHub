services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${DATABASE_USER:-prompthub}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-prompthub}
      - POSTGRES_DB=${DATABASE_NAME:-prompthub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prompthub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-prompthub} -d ${DATABASE_NAME:-prompthub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - GRAPHQL_INTROSPECTION=${GRAPHQL_INTROSPECTION:-false}
      - GRAPHQL_CSRF_PREVENTION=${GRAPHQL_CSRF_PREVENTION:-true}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-prompthub}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-prompthub}
      - DATABASE_NAME=${DATABASE_NAME:-prompthub}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prompthub

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - prompthub

networks:
  prompthub:
    driver: bridge

volumes:
  postgres_data:
