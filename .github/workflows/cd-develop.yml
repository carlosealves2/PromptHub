name: CD Develop

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all projects
        run: npx nx run-many -t build --all

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: build
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      api_version: ${{ steps.release.outputs['apps/api--version'] }}
      web_version: ${{ steps.release.outputs['apps/web--version'] }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  docker-push-dev:
    name: Push Docker Images (Dev)
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/prompthub-api:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/prompthub-api:develop-${{ needs.release-please.outputs.api_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/prompthub-web:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/prompthub-web:develop-${{ needs.release-please.outputs.web_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
